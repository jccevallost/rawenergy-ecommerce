[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Rutas de la tienda (/catalogo, /producto/<slug>) las resuelve la aplicación.
# Los archivos que existen (assets, imágenes) se sirven antes que esta regla.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

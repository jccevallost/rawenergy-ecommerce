# Compila el panel con las URL de producción y lo publica en Azure Static Web Apps.
# Configuración en GitHub (Settings → Secrets and variables → Actions):
#   secreto  AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MEADOW_0E332CB10
#            token de despliegue del panel; lo creó Azure al enlazar el recurso icy-meadow-0e332cb10 con GitHub
#   variable VITE_GRAPHQL_URL                        https://<api-en-render>/graphql
#   variable VITE_WEB_URL                            https://<tienda-en-azure>
# Pasos completos en docs/despliegue-web.md.
name: Panel en Azure

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/azure-panel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-panel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL }}
      VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (fijada por SHA, C61)

      # Sin estas variables Vite compilaría apuntando a localhost.
      - name: Revisar la configuración
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MEADOW_0E332CB10 }}
        run: |
          fallo=0
          [ -n "$TOKEN" ] || { echo "::error::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MEADOW_0E332CB10"; fallo=1; }
          for nombre in VITE_GRAPHQL_URL VITE_WEB_URL; do
            valor="${!nombre}"
            case "$valor" in
              https://*) ;;
              *) echo "::error::La variable $nombre debe existir y empezar con https:// (valor actual: '${valor}')"; fallo=1 ;;
            esac
          done
          case "$VITE_GRAPHQL_URL" in */graphql) ;; *) echo "::error::VITE_GRAPHQL_URL debe terminar en /graphql"; fallo=1 ;; esac
          exit $fallo

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar el panel
        run: npm run build --workspace @vital-forge/admin

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MEADOW_0E332CB10 }}
          action: upload
          app_location: apps/admin/dist
          api_location: ""
          output_location: ""
          skip_app_build: true

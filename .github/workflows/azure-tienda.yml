# Compila la tienda con las URL de producción y la publica en Azure Static Web Apps.
# Configuración en GitHub (Settings → Secrets and variables → Actions):
#   secreto  AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FLOWER_016983B10
#            token de despliegue de la tienda; lo creó Azure al enlazar el recurso lively-flower-016983b10 con GitHub
#   variable VITE_GRAPHQL_URL                         https://<api-en-render>/graphql
#   variable VITE_ADMIN_URL                           https://<panel-en-azure>
# Pasos completos en docs/despliegue-web.md.
name: Tienda en Azure

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/azure-tienda.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-tienda
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL }}
      VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
      # Dirección pública de la tienda: vista previa al compartir (Open Graph, C62).
      VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (fijada por SHA, C61)

      # Sin estas variables Vite compilaría apuntando a localhost.
      - name: Revisar la configuración
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FLOWER_016983B10 }}
        run: |
          fallo=0
          [ -n "$TOKEN" ] || { echo "::error::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FLOWER_016983B10"; fallo=1; }
          for nombre in VITE_GRAPHQL_URL VITE_ADMIN_URL VITE_WEB_URL; do
            valor="${!nombre}"
            case "$valor" in
              https://*) ;;
              *) echo "::error::La variable $nombre debe existir y empezar con https:// (valor actual: '${valor}')"; fallo=1 ;;
            esac
          done
          case "$VITE_GRAPHQL_URL" in */graphql) ;; *) echo "::error::VITE_GRAPHQL_URL debe terminar en /graphql"; fallo=1 ;; esac
          exit $fallo

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar la tienda
        run: npm run build --workspace @vital-forge/web

      - name: Publicar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_FLOWER_016983B10 }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
